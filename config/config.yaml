# MacBook M2 8GB RAM Optimized Configuration

# Data Settings
data:
  dataset_path: "data/raw/IMDB Dataset.csv"
  max_samples: 10000  # Reduce for 8GB RAM
  test_size: 0.2
  random_state: 42

# Embedding Settings
embeddings:
  tfidf:
    max_features: 5000
    ngram_range: [1, 2]
  
  word2vec:
    vector_size: 100
    window: 5
    min_count: 2
    workers: 4
    epochs: 10
  
  bert:
    model_name: "distilbert-base-uncased"  # Lightweight for M2
    max_length: 256
    batch_size: 8

# Model Settings
models:
  logistic_regression:
    C: [0.1, 1.0, 10.0]
    penalty: ['l2']
    max_iter: 1000
  
  random_forest:
    n_estimators: [100, 200]
    max_depth: [10, 20, None]
    min_samples_split: [2, 5]
  
  adaboost:
    n_estimators: [50, 100, 200]
    learning_rate: [0.5, 1.0, 1.5]
  
  lstm:
    hidden_size: 64
    num_layers: 1
    dropout: 0.3
    batch_size: 32
    epochs: 10
    learning_rate: 0.001

# Cross-validation
cross_validation:
  n_splits: 5
  n_repeats: 4  # 5 splits × 4 repeats = 20 iterations

# Device Settings
device:
  use_mps: true  # Apple Silicon acceleration
  fallback_to_cpu: true
